name: Render keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [[ -z "$HEALTH_URL" ]]; then
            echo "Set RENDER_HEALTH_URL as a repository secret."
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            "$HEALTH_URL"
